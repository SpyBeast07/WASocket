services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: was-api
    restart: always
    env_file:
      - .env
    networks:
      - was-net

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: was-engine
    restart: always
    volumes:
      - engine-tokens:/app/tokens
    env_file:
      - .env
    shm_size: '512mb'
    mem_limit: 4G
    mem_reservation: 1G
    security_opt:
      - seccomp:unconfined
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - was-net

  caddy:
    image: caddy:2-alpine
    container_name: was-caddy
    restart: always
    ports:
      - "8083:8083"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - was-net

networks:
  was-net:
    driver: bridge

volumes:
  engine-tokens:
  caddy-data:
  caddy-config:
