services:
  redis:
    image: redis:7-alpine
    container_name: was-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - was-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: was-api
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - was-net

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: was-worker
    restart: always
    depends_on:
      - redis
      - engine
    env_file:
      - .env
    networks:
      - was-net

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: was-engine
    restart: always
    volumes:
      - engine-tokens:/app/tokens
    env_file:
      - .env
    networks:
      - was-net

  caddy:
    image: caddy:2-alpine
    container_name: was-caddy
    restart: always
    ports:
      - "8083:8083"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - was-net

networks:
  was-net:
    driver: bridge

volumes:
  redis-data:
  engine-tokens:
  caddy-data:
  caddy-config:
